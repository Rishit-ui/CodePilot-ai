services:
  codepilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codepilot-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CODEPILOT_HOST: 0.0.0.0
      CODEPILOT_PORT: 3000
      CODEPILOT_AUTH_ENABLED: "true"
      CODEPILOT_SESSION_SECRET: ${CODEPILOT_SESSION_SECRET:?CODEPILOT_SESSION_SECRET must be set to a strong random value}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must reference a durable PostgreSQL database}
      CODEPILOT_DB_SSL_MODE: ${CODEPILOT_DB_SSL_MODE:-verify-full}
      CODEPILOT_RATE_LIMIT_ENABLED: "true"
      CODEPILOT_EXECUTION_MODE: disabled
    volumes:
      - codepilot-data:/app/.data

volumes:
  codepilot-data:
    driver: local

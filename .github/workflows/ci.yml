name: CodePilot AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Syntax & Contract Check
        run: npm run check

      - name: Automated Tests (Unit, SSRF, Security & Integration)
        run: npm test

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser End-to-End Tests
        env:
          TEST_GITHUB_IMPORT: "1"
        run: npm run test:e2e

      - name: Validate Compose Configuration
        env:
          CODEPILOT_SESSION_SECRET: ci-only-randomized-session-secret-000000000000000000000000
          POSTGRES_PASSWORD: ci-only-randomized-database-password
        run: docker compose config --quiet

      - name: Validate Container Configuration
        run: docker build -t codepilot-ai:test .
